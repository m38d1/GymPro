<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d16"/>
      <stop offset="1" stop-color="#05100a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#0f7a3d"/>
    </linearGradient>
    <linearGradient id="plateI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="pulseGlow" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- هالتر -->
  <rect x="148" y="211" width="216" height="28" rx="14" fill="url(#bar)"/>
  <rect x="104" y="150" width="46" height="150" rx="18" fill="url(#plateO)"/>
  <rect x="362" y="150" width="46" height="150" rx="18" fill="url(#plateO)"/>
  <rect x="152" y="170" width="34" height="110" rx="14" fill="url(#plateI)"/>
  <rect x="326" y="170" width="34" height="110" rx="14" fill="url(#plateI)"/>
  <rect x="112" y="158" width="30" height="134" rx="13" fill="none" stroke="#04150b" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="370" y="158" width="30" height="134" rx="13" fill="none" stroke="#04150b" stroke-opacity="0.25" stroke-width="3"/>

  <!-- نبض قلب -->
  <path d="M84 380 H172 L198 342 L228 414 L258 356 L276 380 H428"
        fill="none" stroke="#a3e635" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)"/>
</svg>
